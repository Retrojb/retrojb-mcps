# yaml-language-server: $schema=../../../../../componentSpec.schema.json
specVersion: 1
id: sectionHeading
name: SectionHeading
category: typography
subcategory: headings
status: shipped
complexity: atom
description: >-
  The heading of a section, an h2 drawn at heading-md. Under a TitleHeading
  (also an h2 by default), pass level={3}.

files:
  component: packages/ui/src/components/typography/headings/sectionHeading/SectionHeading.tsx
  types: packages/ui/src/components/typography/headings/sectionHeading/types.ts
  styles: packages/ui/src/components/typography/headings/sectionHeading/styles.ts
  barrel: packages/ui/src/components/typography/headings/sectionHeading/index.ts
  story: apps/retrojb-storybook/src/stories/typography/SectionHeading.stories.tsx
  accessibilityDoc: apps/retrojb-storybook/src/stories/typography/accessibilityDocs/TypographyAccessibility.mdx
  unitTests: null
  visualTests: null
  storybookDocComponent: null

exports:
  - name: SectionHeading
    kind: component
  - name: sectionHeadingStyles
    kind: styles
    note: >-
      Callable from a server component, for markup this package does not own (a
      router link styled as a heading, a legend).
  - name: ISectionHeadingProps
    kind: type
  - name: SectionHeadingVariants
    kind: type
  - name: IHeadingProps
    kind: type
    note: Shared base props for all five headings.
  - name: HeadingLevel
    kind: type
  - name: HeadingSize
    kind: type
  - name: HeadingBase
    kind: component
    internal: true
    note: Renders h{level}. Shared by all five headings; not exported.
  - name: headingStyles
    kind: styles
    internal: true
    note: >-
      Shared recipe in headings/styles.ts that each named heading extends with
      its own default size.

api:
  extends: "ComponentPropsWithRef<'h1'>"
  variants:
    size:
      values:
        [display, heading-xl, heading-lg, heading-md, heading-sm, heading-xs]
      default: heading-md
      note: Visual type role only. It never changes the element.
  props:
    level:
      values: [1, 2, 3, 4, 5, 6]
      default: 2
      note: >-
        Renders h1 to h6. Set it from the document outline, not from how large
        the heading should look (1.3.1).

accessibility:
  element: h1 to h6 (level)
  role: heading
  keyboard: []
  wcag: ["1.3.1", "1.4.3", "1.4.4", "1.4.6", "1.4.10", "1.4.12", "2.4.6"]
  notes:
    - Same default level as TitleHeading and one step smaller. Most pages need
      only one of the two at h2.
    - Size and level are independent props. Do not pick a level to get a size.

usage:
  standalone: true
  composes: []
  nativeElement: true
  alternatives:
    - id: titleHeading
      when: The heading opens a major page region directly under the page title.

tokens:
  - foreground

versioning: {}

figma:
  syncedWith: null

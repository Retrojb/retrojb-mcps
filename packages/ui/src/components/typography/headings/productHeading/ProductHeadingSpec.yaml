# yaml-language-server: $schema=../../../../../componentSpec.schema.json
specVersion: 1
id: productHeading
name: ProductHeading
category: typography
subcategory: headings
status: shipped
complexity: atom
description: >-
  The largest heading: a product name or hero headline at the display role,
  usually the h1 of a landing page. Where the page also has a PageHeading, step
  this one down with level={2} or below.

files:
  component: packages/ui/src/components/typography/headings/productHeading/ProductHeading.tsx
  types: packages/ui/src/components/typography/headings/productHeading/types.ts
  styles: packages/ui/src/components/typography/headings/productHeading/styles.ts
  barrel: packages/ui/src/components/typography/headings/productHeading/index.ts
  story: apps/retrojb-storybook/src/stories/typography/ProductHeading.stories.tsx
  accessibilityDoc: apps/retrojb-storybook/src/stories/typography/accessibilityDocs/TypographyAccessibility.mdx
  unitTests: null
  visualTests: null
  storybookDocComponent: null

exports:
  - name: ProductHeading
    kind: component
  - name: productHeadingStyles
    kind: styles
    note: >-
      Callable from a server component, for markup this package does not own (a
      router link styled as a heading, a legend).
  - name: IProductHeadingProps
    kind: type
  - name: ProductHeadingVariants
    kind: type
  - name: IHeadingProps
    kind: type
    note: Shared base props for all five headings.
  - name: HeadingLevel
    kind: type
  - name: HeadingSize
    kind: type
  - name: HeadingBase
    kind: component
    internal: true
    note: Renders h{level}. Shared by all five headings; not exported.
  - name: headingStyles
    kind: styles
    internal: true
    note: >-
      Shared recipe in headings/styles.ts that each named heading extends with
      its own default size.

api:
  extends: "ComponentPropsWithRef<'h1'>"
  variants:
    size:
      values:
        [display, heading-xl, heading-lg, heading-md, heading-sm, heading-xs]
      default: display
      note: Visual type role only. It never changes the element.
  props:
    level:
      values: [1, 2, 3, 4, 5, 6]
      default: 1
      note: >-
        Renders h1 to h6. Set it from the document outline, not from how large
        the heading should look (1.3.1).

accessibility:
  element: h1 to h6 (level)
  role: heading
  keyboard: []
  wcag: ["1.3.1", "1.4.3", "1.4.4", "1.4.6", "1.4.10", "1.4.12", "2.4.6"]
  notes:
    - Display size is 48px; wrap-break-word keeps a long product name from
      overflowing at 320 CSS px (1.4.10).
    - A page has one h1. If a PageHeading is also present, pass level 2 or
      below.
    - Size and level are independent props. Do not pick a level to get a size.

usage:
  standalone: true
  composes: []
  nativeElement: true
  alternatives:
    - id: pageHeading
      when:
        The heading is the page's title rather than a product name or hero
        headline.

tokens:
  - foreground

versioning: {}

figma:
  syncedWith: null

# yaml-language-server: $schema=../../../../componentSpec.schema.json
specVersion: 1
id: tag
name: Tag
category: content
status: shipped
complexity: atom
description: >-
  A short, non-interactive label attached to an item to categorise it or state
  its status. It is not a control; use Chip for a toggle or filter.

files:
  component: packages/ui/src/components/content/tag/Tag.tsx
  types: packages/ui/src/components/content/tag/types.ts
  styles: packages/ui/src/components/content/tag/styles.ts
  barrel: packages/ui/src/components/content/tag/index.ts
  story: apps/retrojb-storybook/src/stories/content/Tag.stories.tsx
  accessibilityDoc: apps/retrojb-storybook/src/stories/content/accessibilityDocs/TagAccessibility.mdx
  unitTests: null
  visualTests: null
  storybookDocComponent: apps/retrojb-storybook/src/stories/content/Tag.mdx

exports:
  - name: Tag
    kind: component
  - name: tagStyles
    kind: styles
    note: >-
      Callable from a server component, to style an element this package does
      not own.
  - name: ITagProps
    kind: type
  - name: TagVariants
    kind: type

api:
  extends: "ComponentPropsWithRef<'span'>"
  required: [text]
  variants:
    tone:
      values: [neutral, info, success, danger]
      default: neutral
      note: There is no warning tone; the palette has no --warning token.
    size:
      values: [sm, md]
      default: sm
      note: label-md and label-lg type roles.

accessibility:
  element: span
  keyboard: []
  wcag: ["1.4.1", "1.4.3", "1.4.11"]
  notes:
    - Not interactive. It is not focusable and has no handlers, so there is no
      keyboard behaviour and no focus indicator.
    - The text is the signal, so colour is never the only cue.
    - The border is a real border, so it survives forced-colors mode.
    - Target size (2.5.8) does not apply because a tag is not a target.
    - >-
      Contrast ratios, light / dark, measured with checkContrast from
      @retrojb/wcag-a11y-scanner and gated by check:contrast. Text clears 4.5:1
      (1.4.3); the border clears 3:1 (1.4.11), measured on the tag's own fill
      (inner edge) and on --background (the page the outer edge touches).
    - "neutral: fill --tag-neutral-surface (--neutral-1). Text --foreground
      11.78 / 14.69:1 on the fill. Border --border-strong 3.69 / 4.12:1 on the
      fill, 4.16 / 4.41:1 on --background."
    - "info: fill --tag-info-surface (--primary-2). Text --accent-text 13.86 /
      12.20:1 on the fill. Border --accent 7.97 / 8.18:1 on the fill, 6.19 /
      8.87:1 on --background."
    - "success: fill --tag-success-surface (--secondary-2). Text and border
      --success 8.47 / 7.43:1 on the fill, 6.31 / 8.92:1 on --background."
    - "danger: saturated fill and border --danger, text --danger-foreground 9.42
      / 9.44:1 on the fill. Border --danger 6.26 / 8.22:1 on --background. The
      one tone that fills solid, matching Button's danger."

usage:
  standalone: true
  composes: []
  nativeElement: true
  alternatives:
    - id: chip
      when: The label can be pressed, such as a filter or a toggle.
  guidance:
    do:
      - Make the text state the meaning, such as "Deprecated", and treat the
        tone as reinforcement.
      - Keep the text short, a word or two.
    dont:
      - Add an onClick or make a tag look pressable. Use Chip.
      - Rely on tone alone to say what a tag means.

tokens:
  - tag-neutral-surface
  - tag-info-surface
  - tag-success-surface
  - foreground
  - border-strong
  - accent
  - accent-text
  - success
  - danger
  - danger-foreground
  - radius-control
  - label-md
  - label-lg

figma:
  syncedWith: null
